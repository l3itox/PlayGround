<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Orbit Lab — Physics Playground</title>
<style>
:root{color-scheme:dark;--bg:#090d19;--panel:#11182a;--panel2:#151e33;--line:#25314b;--muted:#8491ad;--text:#f4f6ff;--cyan:#73e5ff;--violet:#a88bff;--gold:#ffce72;--green:#83f0bd}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;touch-action:none}button,input{font:inherit}button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{height:100dvh;min-height:500px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 70% 8%,#172448 0,transparent 36%),var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{height:68px;flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid #ffffff0d;background:#0b1020c9;z-index:3}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em;font-size:19px}.brand-icon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#8de7ff,#7c75ff);color:#09101c;box-shadow:0 0 25px #7fcbff40}.brand-icon svg{width:21px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;margin-top:1px}.header-spacer{flex:1}.live-pill{display:flex;align-items:center;gap:7px;border:1px solid #2d405b;border-radius:99px;padding:7px 11px;color:#b9c9e6;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.live-dot{height:7px;width:7px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green)}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#ffffff06;display:grid;place-items:center;color:#aab8d2}.icon-btn:active,.action:active,.tool:active{transform:scale(.96)}.icon-btn svg{width:17px}
main{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}.scene{position:absolute;inset:0}.scene canvas{display:block;width:100%;height:100%;touch-action:none}.canvas-hint{position:absolute;left:50%;top:19px;transform:translateX(-50%);padding:9px 14px;border:1px solid #344365;border-radius:99px;background:#111a2dcc;color:#bdcbe4;white-space:nowrap;font-size:12px;pointer-events:none;transition:opacity .4s}.canvas-hint strong{color:var(--cyan)}.hud{position:absolute;left:20px;top:18px;display:flex;gap:9px;pointer-events:none}.hud-card{min-width:88px;padding:10px 13px;border:1px solid #ffffff14;background:#10182bd9;backdrop-filter:blur(12px);border-radius:14px}.hud-card span{display:block;color:#8795b0;text-transform:uppercase;letter-spacing:.12em;font-size:9px;font-weight:800}.hud-card b{display:block;margin-top:3px;font-size:17px;letter-spacing:-.04em}.hud-card b em{font-size:11px;color:#8998b4;font-style:normal;font-weight:600;letter-spacing:0}.goal-card{position:absolute;right:20px;top:18px;display:flex;align-items:center;gap:11px;padding:10px 14px;border:1px solid #f5ca7250;background:#171b28dd;border-radius:15px;backdrop-filter:blur(12px)}.goal-star{font-size:20px;filter:drop-shadow(0 0 9px #ffd36a)}.goal-card span{display:block;color:#9da8bd;font-size:9px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}.goal-card b{display:block;font-size:14px;margin-top:1px}.goal-card b i{font-style:normal;color:var(--gold)}
.left-controls{position:absolute;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px}.action{height:43px;min-width:43px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid #ffffff16;border-radius:13px;background:#11192bdc;backdrop-filter:blur(12px);font-size:12px;font-weight:700;box-shadow:0 8px 26px #0002}.action svg{width:16px;height:16px;color:#bdcbe2}.action.primary{background:linear-gradient(135deg,#83e6ff,#9a8dff);color:#10172a;border:0;box-shadow:0 5px 25px #72caff35}.action.primary svg{color:#10172a}.bottom-bar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border:1px solid #ffffff16;background:#10182be8;backdrop-filter:blur(16px);border-radius:17px;box-shadow:0 10px 40px #0005}.tool{border:0;background:transparent;color:#a4b0c9;border-radius:12px;min-width:75px;height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:700;transition:.15s}.tool svg{width:19px;height:19px}.tool.selected{background:#26334d;color:var(--cyan);box-shadow:inset 0 0 0 1px #5cccf43b}.tool.selected[data-tool=planet]{color:#d2a9ff}.tool.selected[data-tool=wall]{color:#ffcb78}.tool.selected[data-tool=erase]{color:#ff8c9f}.side-panel{position:absolute;right:20px;bottom:20px;width:218px;padding:15px;border:1px solid #ffffff17;background:#10182be8;backdrop-filter:blur(16px);border-radius:17px;box-shadow:0 10px 40px #0004}.panel-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-heading b{font-size:12px}.panel-heading span{font-size:10px;color:#8795af}.range-row{margin-top:11px}.range-label{display:flex;justify-content:space-between;color:#a7b3cc;font-size:10px;margin-bottom:6px}.range-label strong{color:#eff3ff;font-size:10px}.range-row input{width:100%;height:4px;margin:0;appearance:none;background:linear-gradient(90deg,#74ddff,#a08cff);border-radius:9px;outline:none}.range-row input::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #83dfff;box-shadow:0 0 9px #80ddff88}.panel-note{margin-top:13px;padding-top:10px;border-top:1px solid #ffffff10;color:#8492ac;font-size:10px;line-height:1.5}.panel-note strong{color:#b4c3df;font-weight:600}.toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-8px);padding:10px 15px;border-radius:12px;background:#1a2841;border:1px solid #6580aa66;color:#e8efff;font-size:12px;font-weight:650;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:4}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.side-panel{display:none}.bottom-bar{bottom:14px}.left-controls{left:12px;bottom:14px}.hud{left:12px;top:12px}.goal-card{right:12px;top:12px}.hud-card{padding:8px 10px;min-width:76px}.hud-card b{font-size:15px}.canvas-hint{top:83px}}
@media(max-width:560px){header{height:56px;padding:0 13px}.brand{font-size:17px}.brand-icon{width:31px;height:31px}.live-pill{font-size:9px;padding:6px 8px}.icon-btn{width:34px;height:34px}.hud-card{min-width:69px;padding:7px 8px;border-radius:11px}.hud-card span{font-size:8px}.hud-card b{font-size:14px}.goal-card{padding:8px 10px;gap:7px;border-radius:12px}.goal-star{font-size:17px}.goal-card span{font-size:8px}.goal-card b{font-size:12px}.bottom-bar{bottom:11px;gap:1px;padding:4px;border-radius:15px}.tool{min-width:58px;height:49px;font-size:9px}.tool svg{width:17px;height:17px}.left-controls{bottom:11px;gap:6px}.action{height:40px;min-width:40px;padding:0 11px;border-radius:12px}.action .label{display:none}.canvas-hint{font-size:10px;top:72px;padding:8px 11px}}
@media(max-width:370px){.tool{min-width:50px}.bottom-bar{gap:0}.hud{gap:5px}.hud-card{min-width:62px}.goal-card{right:8px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="currentColor"/><ellipse cx="12" cy="12" rx="10" ry="4.7" stroke="currentColor" stroke-width="1.7" transform="rotate(-28 12 12)"/><circle cx="19.4" cy="7.7" r="1.5" fill="currentColor"/></svg></div><div>ORBIT LAB<small>physics playground</small></div></div><div class="header-spacer"></div><div class="live-pill"><span class="live-dot"></span>SIM LIVE</div><button class="icon-btn" id="helpBtn" aria-label="Help" title="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.7 1.2c-.9 1.3-2.3 1.5-2.3 3.3M12 17h.01" stroke-linecap="round"/></svg></button></header>
<main><div class="scene"><canvas id="world"></canvas></div>
<div class="hud"><div class="hud-card"><span>Gravity</span><b id="gravityRead">1.0 <em>G</em></b></div><div class="hud-card"><span>Objects</span><b id="objectRead">01</b></div></div>
<div class="goal-card"><div class="goal-star">✦</div><div><span>Star hunt</span><b><i id="scoreRead">0</i> / 5</b></div></div>
<div class="canvas-hint" id="hint"><strong>Drag</strong> to launch a ball · Tap to drop</div>
<div class="toast" id="toast"></div>
<div class="left-controls"><button class="action primary" id="playBtn"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="label" id="playLabel">Pause</span></button><button class="action" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/></svg><span class="label">Reset</span></button></div>
<nav class="bottom-bar" aria-label="Physics tools"><button class="tool selected" data-tool="ball"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M8 6.7a6.5 6.5 0 0 1 8.5 2M6.7 15.5a6.5 6.5 0 0 0 7.7 4"/></svg>Ball</button><button class="tool" data-tool="planet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="5.1"/><ellipse cx="12" cy="12" rx="10" ry="3.8" transform="rotate(-25 12 12)"/><circle cx="20.2" cy="7.5" r="1" fill="currentColor"/></svg>Planet</button><button class="tool" data-tool="wall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4zM4 10h16M9 5v5m6 0v5m-6 4v-4"/></svg>Wall</button><button class="tool" data-tool="erase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m4.5 14.5 9.9-10a2 2 0 0 1 2.8 0l2.3 2.3a2 2 0 0 1 0 2.8l-9.9 10H7zM12 19.5h8"/><path d="m9 10 5 5"/></svg>Erase</button></nav>
<div class="side-panel"><div class="panel-heading"><b>World controls</b><span>✦ SANDBOX</span></div><div class="range-row"><div class="range-label"><span>Gravity</span><strong id="gravityValue">1.0×</strong></div><input id="gravitySlider" type="range" min="0" max="2.5" step="0.1" value="1"></div><div class="range-row"><div class="range-label"><span>Bounce</span><strong id="bounceValue">82%</strong></div><input id="bounceSlider" type="range" min="30" max="100" step="1" value="82"></div><div class="panel-note"><strong>Make your own physics.</strong> Drop balls, bend their path with planets, or draw walls to build a star-catching machine.</div></div>
</main></div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const gravitySlider=document.getElementById('gravitySlider'),bounceSlider=document.getElementById('bounceSlider');
const gravityRead=document.getElementById('gravityRead'),gravityValue=document.getElementById('gravityValue'),bounceValue=document.getElementById('bounceValue'),objectRead=document.getElementById('objectRead'),scoreRead=document.getElementById('scoreRead');
const hint=document.getElementById('hint'),toast=document.getElementById('toast');
let W=0,H=0,dpr=1,balls=[],planets=[],walls=[],stars=[],score=0,paused=false,tool='ball',pointer=null,showHint=true,lastTime=0,toastTimer;
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=stars.filter(s=>s.x<W-35&&s.y<H-35);while(stars.length<5-score)stars.push(makeStar());}
function makeStar(){return{x:rand(65,Math.max(66,W-55)),y:rand(115,Math.max(116,H-85)),phase:rand(0,6.2)}}
function reset(){balls=[{x:W*.24,y:H*.27,vx:1.6,vy:0,r:17,hue:190,trail:[]}];planets=[];walls=[];score=0;stars=[];while(stars.length<5)stars.push(makeStar());paused=false;syncPlay();updateHUD();say('Fresh universe. Let gravity do its thing.');}
function updateHUD(){const g=Number(gravitySlider.value);gravityRead.innerHTML=`${g.toFixed(1)} <em>G</em>`;gravityValue.textContent=`${g.toFixed(1)}×`;bounceValue.textContent=`${bounceSlider.value}%`;objectRead.textContent=String(balls.length+planets.length+walls.length).padStart(2,'0');scoreRead.textContent=score;}
function say(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100)}
function xy(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('selected',b.dataset.tool===t));const messages={ball:'Drag to launch a ball · Tap to drop',planet:'Tap anywhere to place a gravity planet',wall:'Drag to build a solid wall',erase:'Tap an object to remove it'};hint.innerHTML=`<strong>${t==='ball'?'Drag':t==='wall'?'Drag':'Tap'}</strong> ${messages[t].replace(/^Drag |^Tap /,'')}`;}
function addBall(x,y,vx=0,vy=0){if(balls.length>=45){say('That is a crowded universe!');return}balls.push({x,y,vx,vy,r:rand(12,18),hue:rand(175,218),trail:[]});updateHUD()}
function onDown(e){e.preventDefault();const p=xy(e);canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,start:p,end:p,moved:false};if(tool==='ball')pointer.aim=true;else if(tool==='wall')pointer.wall=true;else if(tool==='erase'){eraseAt(p.x,p.y);pointer=null}else if(tool==='planet'){planets.push({x:p.x,y:p.y,r:22,mass:1,phase:rand(0,6)});updateHUD();say('Planet placed · nearby balls will orbit');pointer=null;}}
function onMove(e){if(!pointer||e.pointerId!==pointer.id)return;pointer.end=xy(e);pointer.moved=Math.hypot(pointer.end.x-pointer.start.x,pointer.end.y-pointer.start.y)>7}
function onUp(e){if(!pointer||e.pointerId!==pointer.id)return;const q=pointer;pointer=null;if(q.aim){if(q.moved){const dx=q.start.x-q.end.x,dy=q.start.y-q.end.y,mag=Math.hypot(dx,dy)||1;addBall(q.start.x,q.start.y,dx/mag*Math.min(17,mag*.13),dy/mag*Math.min(17,mag*.13));}else addBall(q.start.x,q.start.y,rand(-1,1),rand(-1,1));hideHint()}else if(q.wall&&q.moved){const x=Math.min(q.start.x,q.end.x),y=Math.min(q.start.y,q.end.y),w=Math.abs(q.end.x-q.start.x),h=Math.abs(q.end.y-q.start.y);if(w>12||h>12){walls.push({x,y,w:Math.max(w,18),h:Math.max(h,18)});updateHUD()}else say('Drag to draw a wall');}}
function hideHint(){if(showHint){showHint=false;hint.style.opacity='0'}}
function eraseAt(x,y){for(let i=balls.length-1;i>=0;i--)if(Math.hypot(x-balls[i].x,y-balls[i].y)<balls[i].r+12){balls.splice(i,1);updateHUD();return}for(let i=planets.length-1;i>=0;i--)if(Math.hypot(x-planets[i].x,y-planets[i].y)<planets[i].r+12){planets.splice(i,1);updateHUD();return}for(let i=walls.length-1;i>=0;i--){const a=walls[i];if(x>=a.x-8&&x<=a.x+a.w+8&&y>=a.y-8&&y<=a.y+a.h+8){walls.splice(i,1);updateHUD();return}}}
canvas.addEventListener('pointerdown',onDown);canvas.addEventListener('pointermove',onMove);canvas.addEventListener('pointerup',onUp);canvas.addEventListener('pointercancel',()=>pointer=null);
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
gravitySlider.addEventListener('input',updateHUD);bounceSlider.addEventListener('input',updateHUD);
document.getElementById('resetBtn').addEventListener('click',reset);
function syncPlay(){document.getElementById('playLabel').textContent=paused?'Resume':'Pause';document.getElementById('playIcon').innerHTML=paused?'<path d="M8 5v14l11-7z"/>':'<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';}
document.getElementById('playBtn').addEventListener('click',()=>{paused=!paused;syncPlay();say(paused?'Simulation paused':'Simulation running')});
document.getElementById('helpBtn').addEventListener('click',()=>say('Choose a tool, then tap or drag in the universe. Collect all 5 stars!'));
const dust=Array.from({length:85},()=>({x:Math.random(),y:Math.random(),a:rand(.15,.55),s:rand(.5,1.7)}));
function collideWalls(b){for(const a of walls){const nx=clamp(b.x,a.x,a.x+a.w),ny=clamp(b.y,a.y,a.y+a.h),dx=b.x-nx,dy=b.y-ny;if(dx*dx+dy*dy<b.r*b.r){if(Math.abs(dx)>Math.abs(dy)){b.x=dx>0?a.x+a.w+b.r:a.x-b.r;b.vx=Math.abs(b.vx)*Math.sign(dx||1)*.78}else{b.y=dy>0?a.y+a.h+b.r:a.y-b.r;b.vy=Math.abs(b.vy)*Math.sign(dy||1)*.78}}}}
function step(dt){const scale=Math.min(dt/16.67,2.1),g=Number(gravitySlider.value)*.22,bounce=Number(bounceSlider.value)/100;
for(const b of balls){b.trail.push({x:b.x,y:b.y});if(b.trail.length>10)b.trail.shift();b.vy+=g*scale;
for(const p of planets){const dx=p.x-b.x,dy=p.y-b.y,d2=dx*dx+dy*dy,dist=Math.sqrt(d2)||1;if(dist>p.r+2){const force=Math.min(.48, (p.mass*34/(d2+260))*scale);b.vx+=dx/dist*force;b.vy+=dy/dist*force}}
b.x+=b.vx*scale;b.y+=b.vy*scale;b.vx*=Math.pow(.999,scale);b.vy*=Math.pow(.999,scale);
if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*bounce}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*bounce}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*bounce}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*bounce;if(Math.abs(b.vy)<.7)b.vy=0}collideWalls(b);
}
for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d>0&&d<min){const nx=dx/d,ny=dy/d,over=min-d;a.x-=nx*over*.5;a.y-=ny*over*.5;b.x+=nx*over*.5;b.y+=ny*over*.5;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-(1+bounce)*rel*.5;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}}
for(let i=stars.length-1;i>=0;i--){const s=stars[i];for(const b of balls)if(Math.hypot(b.x-s.x,b.y-s.y)<b.r+12){stars.splice(i,1);score++;updateHUD();say(score>=5?'✨ Star master! You cleared the universe!':'Star collected! Keep going.');if(score<5)stars.push(makeStar());break}}
}
function pathStar(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function draw(t){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#101a32');bg.addColorStop(.55,'#0c1427');bg.addColorStop(1,'#0a1120');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.save();for(const d of dust){ctx.globalAlpha=d.a;ctx.fillStyle='#bad6ff';ctx.beginPath();ctx.arc(d.x*W,d.y*H,d.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
ctx.strokeStyle='#8ba9dc0d';ctx.lineWidth=1;const stepSize=42,off=(t*.008)%stepSize;for(let x=0;x<W;x+=stepSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-stepSize;y<H+stepSize;y+=stepSize){ctx.beginPath();ctx.moveTo(0,y+off);ctx.lineTo(W,y+off);ctx.stroke()}
for(const s of stars){const pulse=1+Math.sin(t*.004+s.phase)*.12;ctx.shadowColor='#ffd36a';ctx.shadowBlur=22;pathStar(s.x,s.y,12*pulse);ctx.fillStyle='#ffda78';ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(s.x,s.y,19*pulse,0,Math.PI*2);ctx.strokeStyle='#ffd36a25';ctx.stroke()}
for(const a of walls){const grad=ctx.createLinearGradient(a.x,a.y,a.x+a.w,a.y+a.h);grad.addColorStop(0,'#415270');grad.addColorStop(.5,'#273750');grad.addColorStop(1,'#1a263b');ctx.fillStyle=grad;ctx.strokeStyle='#91b4d568';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(a.x,a.y,a.w,a.h,5);ctx.fill();ctx.stroke();ctx.strokeStyle='#c0d8ff25';ctx.beginPath();ctx.moveTo(a.x+4,a.y+3);ctx.lineTo(a.x+a.w-4,a.y+3);ctx.stroke()}
